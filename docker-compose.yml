services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: notes-backend:latest
    container_name: notes-backend
    expose:
      - "5001"  # Internal backend port
    environment:
      - PORT=5001
      - DB_PATH=/data/notes.db
    volumes:
      - notes-data:/data
    restart: unless-stopped
    networks:
      - notes-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: notes-frontend:latest
    container_name: notes-frontend
    ports:
      - "3001:80" # Host port 3001 mapped to container port 80
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - notes-net

volumes:
  notes-data:

networks:
  notes-net:
    driver: bridge
